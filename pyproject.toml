[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taklatoon"
version = "0.1.0"
description = "A reproducible 2D physics sandbox for learning unfamiliar game dynamics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pygame>=2.6.1,<3", "pymunk>=7,<8", "gymnasium>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
taklatoon = "taklatoon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

